# Docker DNS must be consulted again after an API container replacement.
map $http_x_request_id $kabisa_request_id {
    default $request_id;
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
}
map $http_x_forwarded_proto $kabisa_forwarded_proto {
    default $scheme;
    https https;
    http http;
}
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    # Do not enable non_idempotent: nginx must not replay sent POST/PATCH requests.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kabisa_forwarded_proto;
    proxy_set_header X-Request-ID $kabisa_request_id;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 @api_unavailable;
    location @api_unavailable {
        default_type application/json;
        add_header X-Request-ID $kabisa_request_id always;
        add_header Retry-After 2 always;
        return 503 '{"detail":"The API is temporarily unavailable. Please try again shortly.","code":"upstream_unavailable"}';
    }
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
    }

    location /uploads/ {
        proxy_pass $api_upstream$request_uri;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /docs {
        proxy_pass $api_upstream$request_uri;
    }

    location = /openapi.json {
        proxy_pass $api_upstream$request_uri;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
