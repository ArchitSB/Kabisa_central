server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
    include /etc/nginx/kabisa-security.conf;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /api/v1/store/ {
        proxy_pass http://api:8000/api/v1/store/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    location /api/ { return 404; }
    location /uploads/products/ {
        proxy_pass http://api:8000/uploads/products/;
        proxy_set_header Host $host;
        expires 1d;
    }
    location = /sitemap.xml { proxy_pass http://api:8000/api/v1/store/sitemap.xml; }
    location = /robots.txt { proxy_pass http://api:8000/api/v1/store/robots.txt; }
    location = /sw.js {
        include /etc/nginx/kabisa-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/kabisa-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /images/ { expires 1d; try_files $uri =404; }
    location / {
        include /etc/nginx/kabisa-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
